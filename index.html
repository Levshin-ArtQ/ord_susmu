<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#146B3A" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ЮУГМУ" />
    <meta
      name="description"
      content="Офлайн-расписание ординатуры: календарь, текущий цикл, преподаватели и площадки."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=yes" />
    <script>
      (function () {
        var pref = "auto";
        try { pref = localStorage.getItem("ordinatura:theme") || "auto"; } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0c1410" : "#146B3A");
      })();
    </script>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-512.svg" />
    <title>ЮУГМУ · Ординатура</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      html, body { background: var(--bg, #f3f6f3); color: var(--text, #14241a); margin: 0; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0c1410; color: #e7f0ea; }
      #app-content .empty { padding: 48px 16px; text-align: center; color: var(--muted, #5b6f62); }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="app">
      <main id="app-content"><div class="empty">Загрузка…</div></main>
    </div>

    <nav class="bottom-nav" aria-label="Меню">
      <div class="bottom-nav-inner">
        <button type="button" class="nav-item active" data-view="today">
          <span class="ico" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" fill="none" /><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none" /></svg></span
          ><span>Сегодня</span>
        </button>
        <button type="button" class="nav-item" data-view="calendar">
          <span class="ico" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2.2" fill="none" /><path d="M4 9.5h16M8 4v3.2M16 4v3.2" fill="none" /></svg></span
          ><span>План</span>
        </button>
        <button type="button" class="nav-item" data-view="cycles">
          <span class="ico" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h10" fill="none" /></svg></span
          ><span>Циклы</span>
        </button>
        <button type="button" class="nav-item" data-view="book" hidden>
          <span class="ico" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.1" fill="none" /><path d="M4.5 18c.6-3 2.4-4.4 4.5-4.4s3.9 1.4 4.5 4.4M16.2 9.2h4M18.2 7.2v4" fill="none" /></svg></span
          ><span>Контакты</span>
        </button>
        <button type="button" class="nav-item" data-view="more">
          <span class="ico" aria-hidden="true"
            ><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="1.4" fill="currentColor" stroke="none" /><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" /><circle cx="12" cy="17" r="1.4" fill="currentColor" stroke="none" /></svg></span
          ><span>Ещё</span>
        </button>
      </div>
    </nav>

    <div id="modal-root" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="xlsx-input" class="hidden-file" type="file" accept=".xlsx,.xls,.xlsm" />
    <input id="backup-input" class="hidden-file" type="file" accept="application/json,.json" />

    <script src="data/seed.js" defer></script>
    <script src="js/db.js" defer></script>
    <script src="js/parse.js" defer></script>
    <script src="js/xlsx.js" defer></script>
    <script src="js/schedule.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
